name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases on tags
  packages: write   # push the server image to GHCR on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: build/cache
          key: mod-jars-${{ hashFiles('index.toml') }}
          restore-keys: mod-jars-

      - name: Check the index is up to date
        run: |
          packwiz refresh
          git diff --exit-code -- index.toml pack.toml || (echo "::error::Run 'packwiz refresh' and commit index.toml" && exit 1)

      - name: Build all formats
        run: python tools/build.py

      - name: Static dependency check
        run: python tools/check_deps.py

      - uses: actions/upload-artifact@v4
        with:
          name: mundus-foci
          path: |
            dist/*.mrpack
            dist/*.zip
            MODLIST.md
          if-no-files-found: error

  test-server:
    # Boots the real server pack once (Java 17) and fails on crash or KubeJS load failure.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/packwiz/packwiz@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: mod-jars-${{ hashFiles('index.toml') }}
          restore-keys: mod-jars-
      # This runner's throw-away test world accepts the Minecraft EULA (https://aka.ms/MinecraftEULA).
      - name: Boot test
        run: python tools/build.py server --test-server --java java --timeout 20
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-server-logs
          path: |
            build/test-server/logs/
            build/test-server/crash-reports/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mundus-foci
          path: dist-artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/dist/*.mrpack
            dist-artifacts/dist/*.zip
            dist-artifacts/MODLIST.md
          body_path: CHANGELOG.md

      - name: Prepare Docker context
        run: |
          mkdir -p dist && cp dist-artifacts/dist/mundus-foci-latest.mrpack dist/
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/mundus-foci-server:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/mundus-foci-server:latest
